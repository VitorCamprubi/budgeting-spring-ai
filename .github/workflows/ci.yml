name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura o Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Configura o Gradle
        uses: gradle/actions/setup-gradle@v6

      # Os testes *IT que chamam a OpenAI são ignorados quando OPENAI_API_KEY não está definida.
      # O MySQL dos testes sobe via Testcontainers (Docker já vem instalado no runner).
      - name: Build e testes
        run: ./gradlew build

      - name: Publica relatório de testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-de-testes
          path: build/reports/tests/test
